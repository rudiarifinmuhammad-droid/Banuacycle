                          <p className="text-xs text-brand-magenta font-bold text-left">{item.weight} • {item.condition}</p>
                          <p className="text-xs text-gray-500 text-left flex items-center">
                            <IconMapPin className="w-3.5 h-3.5 mr-1 text-gray-400" />
                            {item.location}
                          </p>
                          <p className="text-[11px] text-gray-400 text-left font-medium">Supplier: {item.provider}</p>
                          
                          <div className="pt-2 text-left">
                            <button 
                              onClick={() => handleClaimFabric(item)}
                              className="px-3.5 py-1.5 border border-brand-magenta text-brand-magenta hover:bg-brand-magenta hover:text-white text-xs font-bold rounded-xl transition-colors shadow-xs">
                              Request Pickup
                            </button>
                          </div>
                        </div>

                        <button 
                          onClick={() => {
                            if (wishlist.includes(item.id)) {
                              setWishlist(wishlist.filter(i => i !== item.id));
                            } else {
                              setWishlist([...wishlist, item.id]);
                            }
                          }}
                          className="absolute top-3 right-3 text-gray-400 hover:text-brand-magenta">
                          <IconHeart className="w-5 h-5" filled={wishlist.includes(item.id)} />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Community Hubs Screen */}
            {currentScreen === 'community' && (
              <div className="p-5 space-y-4 pb-24 text-left">
                <div className="flex justify-between items-center text-left">
                  <h2 className="text-lg font-black text-black tracking-tight">Community Hubs</h2>
                  <button onClick={() => setShowNotifModal(true)} className="p-2.5 bg-white border border-gray-200 rounded-full text-gray-700 shadow-xs hover:bg-gray-50">
                    <IconBell className="w-5 h-5" />
                  </button>
                </div>

                <div className="relative text-left">
                  <input 
                    type="text" 
                    placeholder="Search communities, topics, or events..." 
                    className="w-full pl-4 pr-11 py-3 bg-white border border-gray-200 rounded-2xl text-xs font-medium focus:outline-none focus:border-brand-magenta shadow-xs text-left" 
                  />
                  <IconSearch className="w-5 h-5 text-gray-400 absolute right-3.5 top-3" />
                </div>

                <div className="bg-gradient-to-r from-orange-400 to-brand-orange rounded-3xl p-5 text-white relative overflow-hidden shadow-sm flex items-center justify-between">
                  <div className="w-3/5 space-y-2.5 z-10 text-left">
                    <h3 className="text-sm font-black leading-snug text-left">
                      Join Local Tailors to Create Circular Economies
                    </h3>
                    <button 
                      onClick={() => triggerToast('Explore local hub list below')}
                      className="bg-white text-brand-dark text-xs font-bold px-4 py-2 rounded-xl shadow-sm hover:bg-gray-100">
                      Explore Hubs
                    </button>
                  </div>

                  <div className="w-2/5 flex justify-end">
                    <div className="w-20 h-20 rounded-2xl overflow-hidden border-2 border-white/80 shadow-md">
                      <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=300&q=80" className="w-full h-full object-cover" alt="Community members" />
                    </div>
                  </div>
                </div>

                <div className="space-y-3 text-left">
                  <h4 className="text-sm font-extrabold text-black text-left">Nearby Hubs & Collectives</h4>

                  <div className="space-y-3">
                    {communities.map((comm) => (
                      <div key={comm.id} className="bg-white border border-slate-100 p-4 rounded-2xl flex items-center space-x-3.5 shadow-xs justify-between">
                        <div className="flex items-center space-x-3">
                          <img src={comm.img} className="w-14 h-14 rounded-2xl object-cover border border-slate-100 shadow-xs" alt={comm.name} />
                          <div className="text-left space-y-0.5">
                            <h5 className="text-xs font-extrabold text-gray-900">{comm.name}</h5>
                            <span className="text-xs text-gray-500 block">{comm.location}</span>
                            <span className="text-[11px] text-gray-400 font-medium">{comm.members} Members</span>
                          </div>
                        </div>

                        <button 
                          onClick={() => handleToggleCommunity(comm.id)}
                          className={`px-4 py-2 text-xs font-bold rounded-xl transition-colors shadow-xs shrink-0 ${
                            comm.joined 
                              ? 'bg-emerald-100 text-emerald-800' 
                              : 'bg-brand-magenta text-white hover:bg-brand-magentaDark'
                          }`}>
                          {comm.joined ? 'Joined' : 'Join Hub'}
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Learning Screen */}
            {currentScreen === 'learning' && (
              <div className="p-5 space-y-4 pb-24 text-left">
                <div className="flex justify-between items-center text-left">
                  <BanuaCycleLogo className="w-8 h-8" showText={true} textClassName="text-base font-black" />
                  <button onClick={() => setShowNotifModal(true)} className="p-2.5 bg-white border border-gray-200 rounded-full text-gray-700 shadow-xs hover:bg-gray-50">
                    <IconBell className="w-5 h-5" />
                  </button>
                </div>

                <div className="text-left space-y-1 bg-white p-4 rounded-3xl border border-slate-100 shadow-xs">
                  <h2 className="text-base font-black text-brand-magenta leading-none uppercase">WORKSHOPS & E-LEARNING</h2>
                  <p className="text-xs font-bold text-orange-500">Learn, Innovate & Empower</p>
                  <p className="text-xs text-gray-600 leading-relaxed pt-1">
                    Upgrade sewing skills, master patchwork craftsmanship, and learn upcycling techniques from experts.
                  </p>
                </div>

                <div className="space-y-3 text-left">
                  <h4 className="text-sm font-extrabold text-black text-left">Available Training Programs</h4>

                  <div className="space-y-3">
                    {trainings.map((item) => (
                      <div key={item.id} className="bg-white border border-slate-100 rounded-2xl p-3.5 space-y-3 text-left shadow-xs">
                        <div className="flex space-x-3.5">
                          <img src={item.img} className="w-24 h-24 rounded-xl object-cover shrink-0" alt="Program" />
                          <div className="flex-1 space-y-1 text-left">
                            <span className="bg-amber-400 text-white font-extrabold text-[9px] px-2 py-0.5 rounded-full uppercase tracking-wider">OFFICIAL WORKSHOP</span>
                            <h5 className="text-xs font-extrabold text-gray-900 leading-snug text-left pt-0.5">{item.title}</h5>
                            
                            <div className="flex items-center space-x-1.5 text-xs text-gray-600 pt-1 text-left">
                              <IconCalendar className="w-3.5 h-3.5 text-gray-400" />
                              <span>{item.date}</span>
                            </div>
                            <div className="flex items-center space-x-1.5 text-xs text-gray-600 text-left">
                              <IconMapPin className="w-3.5 h-3.5 text-gray-400" />
                              <span>{item.location}</span>
                            </div>
                          </div>
                        </div>

                        <div className="flex justify-between items-center border-t border-slate-100 pt-2.5">
                          <span className="text-xs font-bold text-emerald-600">Free Registration</span>
                          <button 
                            onClick={() => handleRegisterTraining(item.id)}
                            className={`px-4 py-2 font-bold text-xs rounded-xl shadow-xs transition-colors ${
                              item.registered 
                                ? 'bg-emerald-600 text-white' 
                                : 'bg-brand-magenta text-white hover:bg-brand-magentaDark'
                            }`}>
                            {item.registered ? 'Registered' : 'Enroll Now'}
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* Profile Screen */}
            {currentScreen === 'profile' && (
              <div className="p-5 space-y-4 pb-24 text-left">
                <div className="flex justify-between items-center text-left">
                  <BanuaCycleLogo className="w-8 h-8" showText={true} textClassName="text-base font-black" />
                  <button 
                    onClick={() => { setCurrentScreen('start'); triggerToast('Signed Out Successfully'); }}
                    className="p-2 border border-rose-200 rounded-xl text-rose-600 hover:bg-rose-50 flex items-center space-x-1 text-xs font-bold px-3">
                    <IconLogOut className="w-4 h-4" />
                    <span>Sign Out</span>
                  </button>
                </div>

                {/* Profile Card */}
                <div className="bg-white border border-slate-100 rounded-3xl p-4 flex items-center space-x-3.5 shadow-xs">
                  <div className="w-14 h-14 bg-brand-magenta text-white rounded-2xl flex items-center justify-center font-black text-xl shadow-md">
                    {user.name.charAt(0)}
                  </div>
                  <div className="space-y-0.5">
                    <h3 className="text-sm font-extrabold text-gray-900">{user.name}</h3>
                    <p className="text-xs text-gray-500 font-medium">{user.role}</p>
                    <span className="text-xs font-black text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md inline-block mt-1">Impact Balance: {user.points} Pts</span>
                  </div>
                </div>

                <div className="text-left space-y-0.5 pt-1">
                  <h2 className="text-base font-black text-black leading-none uppercase">ENVIRONMENTAL IMPACT</h2>
                  <p className="text-xs text-gray-500">Real-time stats on your community contributions</p>
                </div>

                {/* Impact Stat Cards */}
                <div className="space-y-2 text-left">
                  <div className="grid grid-cols-2 gap-3 text-left">
                    <div className="bg-white border border-slate-100 p-3.5 rounded-2xl flex space-x-3 items-center text-left shadow-xs">
                      <div className="w-10 h-10 bg-amber-100 rounded-xl flex items-center justify-center shrink-0">
                        <IconLeaf className="w-5 h-5 text-amber-700" />
                      </div>
                      <div className="text-left space-y-0.5">
                        <div className="text-sm font-black text-gray-900">1,250 <span className="text-xs font-medium">kg</span></div>
                        <span className="text-[10px] text-gray-500 block leading-tight font-medium">Fabric Collected</span>
                        <span className="text-[10px] font-extrabold text-emerald-600 flex items-center pt-0.5">
                          <IconTrendingUp className="w-3 h-3 mr-0.5" /> +32% this mo
                        </span>
                      </div>
                    </div>

                    <div className="bg-white border border-slate-100 p-3.5 rounded-2xl flex space-x-3 items-center text-left shadow-xs">
                      <div className="w-10 h-10 bg-emerald-100 rounded-xl flex items-center justify-center shrink-0">
                        <IconRecycle className="w-5 h-5 text-emerald-700" />
                      </div>
                      <div className="text-left space-y-0.5">
                        <div className="text-sm font-black text-gray-900">909 <span className="text-xs font-medium">kg</span></div>
                        <span className="text-[10px] text-gray-500 block leading-tight font-medium">Recycled Materials</span>
                        <span className="text-[10px] font-extrabold text-emerald-600 flex items-center pt-0.5">
                          <IconTrendingUp className="w-3 h-3 mr-0.5" /> +28% this mo
                        </span>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Chart Visualization */}
                <div className="space-y-2 text-left pt-2">
                  <h4 className="text-xs font-extrabold text-gray-800 uppercase tracking-wider text-left">6-MONTH RECYCLING TREND</h4>
                  <div className="bg-white border border-slate-100 p-4 rounded-3xl space-y-3 text-left shadow-xs">
                    <div className="h-28 w-full relative flex items-end pt-2 pb-2 border-b border-gray-100">
                      <svg className="w-full h-full" viewBox="0 0 300 60">
                        <path d="M 0 50 Q 50 40 100 35 T 200 20 T 300 10" fill="none" stroke="#059669" strokeWidth="3" />
                        <path d="M 0 55 Q 50 48 100 42 T 200 30 T 300 20" fill="none" stroke="#f59e0b" strokeWidth="3" />
                      </svg>
                    </div>
                    <div className="flex justify-between text-[10px] text-gray-500 font-bold px-1">
                      <span>Dec</span>
                      <span>Jan</span>
                      <span>Feb</span>
                      <span>Mar</span>
                      <span>Apr</span>
                      <span>May</span>
                    </div>
                  </div>
                </div>

              </div>
            )}

          </div>

          {/* Modal: Setor Kain Form */}
          {showFabricModal && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end justify-center p-0">
              <div className="bg-white w-full rounded-t-3xl p-6 space-y-4 shadow-2xl border-t border-gray-200">
                <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                  <h3 className="text-sm font-bold text-gray-900">Deposit Fabric Scraps</h3>
                  <button onClick={() => setShowFabricModal(false)}><IconX className="w-5 h-5 text-gray-500" /></button>
                </div>

                <form onSubmit={handleAddFabricSubmit} className="space-y-4 text-left">
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Batch Description / Title</label>
                    <input 
                      type="text" 
                      placeholder="e.g. Traditional Sasirangan Cotton Scraps"
                      value={newFabricForm.title}
                      onChange={(e) => setNewFabricForm({ ...newFabricForm, title: e.target.value })}
                      className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">Category</label>
                      <select 
                        value={newFabricForm.category}
                        onChange={(e) => setNewFabricForm({ ...newFabricForm, category: e.target.value })}
                        className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium">
                        <option value="Cotton">Cotton</option>
                        <option value="Sasirangan">Sasirangan</option>
                        <option value="Denim">Denim</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-gray-700 mb-1">Weight (kg)</label>
                      <input 
                        type="number" 
                        step="0.1"
                        placeholder="e.g. 3.5"
                        value={newFabricForm.weight}
                        onChange={(e) => setNewFabricForm({ ...newFabricForm, weight: e.target.value })}
                        className="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl text-xs font-medium"
                      />
                    </div>
                  </div>

                  <button type="submit" className="w-full py-3 bg-brand-magenta text-white font-bold rounded-xl text-xs shadow-md hover:bg-brand-magentaDark">
                    Submit & Publish Batch
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Shopping Cart */}
          {showCartModal && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end justify-center p-0">
              <div className="bg-white w-full max-h-[80%] rounded-t-3xl p-6 space-y-4 flex flex-col justify-between shadow-2xl">
                <div>
                  <div className="flex justify-between items-center border-b border-gray-100 pb-3 mb-3">
                    <h3 className="text-sm font-bold text-gray-900">Your Shopping Cart</h3>
                    <button onClick={() => setShowCartModal(false)}><IconX className="w-5 h-5 text-gray-500" /></button>
                  </div>

                  {cart.length === 0 ? (
                    <div className="text-center py-10 text-xs text-gray-500 font-medium">Your shopping cart is currently empty</div>
                  ) : (
                    <div className="space-y-3 max-h-60 overflow-y-auto pr-1 text-left">
                      {cart.map((item) => (
                        <div key={item.id} className="flex justify-between items-center border border-gray-100 p-3 rounded-2xl text-xs">
                          <div>
                            <p className="font-extrabold text-gray-900">{item.title}</p>
                            <p className="text-xs text-brand-magenta font-bold">{item.priceFormatted} × {item.qty}</p>
                          </div>
                          <span className="font-black text-gray-900">Rp{(item.price * item.qty).toLocaleString()}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="pt-3 border-t border-gray-100 space-y-3">
                    <div className="flex justify-between text-xs font-extrabold text-gray-900">
                      <span>Total Amount</span>
                      <span className="text-brand-magenta text-sm font-black">Rp{totalCartPrice.toLocaleString()}</span>
                    </div>
                    <button onClick={handleCheckout} className="w-full py-3.5 bg-brand-magenta text-white font-bold rounded-xl text-xs shadow-md hover:bg-brand-magentaDark">
                      Proceed to Checkout
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Modal: Notifications */}
          {showNotifModal && (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-end justify-center p-0">
              <div className="bg-white w-full rounded-t-3xl p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-gray-100 pb-3">
                  <h3 className="text-sm font-bold text-gray-900">Notifications</h3>
                  <button onClick={() => setShowNotifModal(false)}><IconX className="w-5 h-5 text-gray-500" /></button>
                </div>

                <div className="space-y-3 max-h-72 overflow-y-auto">
                  {notifications.map((n) => (
                    <div key={n.id} className="p-3 bg-slate-50 rounded-2xl border border-gray-100 space-y-1 text-left">
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold text-gray-900">{n.title}</span>
                        <span className="text-[10px] text-gray-400 font-medium">{n.time}</span>
                      </div>
                      <p className="text-xs text-gray-600">{n.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Bottom Navigation Bar */}
          {['home', 'fabric_bank', 'community', 'learning', 'profile'].includes(currentScreen) && (
            <div className="bg-white border-t border-gray-100 px-3 py-2.5 flex justify-around items-center z-40 shrink-0 shadow-lg">
              {[
                { id: 'home', label: 'Home', IconComponent: IconHome },
                { id: 'fabric_bank', label: 'Rag Bank', IconComponent: IconLayers },
                { id: 'community', label: 'Hubs', IconComponent: IconUsers },
                { id: 'learning', label: 'Learn', IconComponent: IconGraduationCap },
                { id: 'profile', label: 'Impact', IconComponent: IconUser }
              ].map((nav) => {
                const isActive = currentScreen === nav.id;
                return (
                  <button 
                    key={nav.id} 
                    onClick={() => setCurrentScreen(nav.id)}
                    className={`flex flex-col items-center space-y-1 transition-colors ${
                      isActive ? 'text-brand-magenta font-extrabold' : 'text-gray-400 hover:text-gray-600'
                    }`}>
                    <nav.IconComponent className={`w-5 h-5 ${isActive ? 'stroke-[2.5]' : 'stroke-1.5'}`} />
                    <span className="text-[10px] font-medium">{nav.label}</span>
                  </button>
                );
              })}
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BanuaCycleApp />);
  </script>
</body>
</html>
